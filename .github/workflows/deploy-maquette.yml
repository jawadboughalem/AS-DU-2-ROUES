name: Déploiement de la maquette

# Publie la maquette sur GitHub Pages à chaque push sur main.
#
# Le build tourne sur l'infrastructure GitHub : c'est le pipeline CI/CD normal
# d'un projet, et il ne dépend d'aucun compte tiers.
#
# Pourquoi une branche gh-pages plutôt que l'artefact Pages officiel :
# actions/configure-pages doit appeler l'API « create a Pages site », et le
# jeton du workflow n'a pas ce droit sur ce dépôt (Resource not accessible by
# integration). Publier sur une branche ne demande que le droit d'écriture sur
# le contenu, dont le workflow dispose.
#
# Cette cible est provisoire : dès que le formulaire enverra réellement des
# e-mails et que l'espace d'administration existera, le site aura besoin de
# routes serveur et basculera sur Netlify (voir docs/DEPLOIEMENT.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-maquette
  cancel-in-progress: true

jobs:
  deploy:
    name: build et publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build statique
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          # Un site de projet est servi sous /<nom-du-dépôt>/ : le basePath est
          # dérivé du dépôt pour survivre à un renommage.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Publication sur la branche gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Maquette déployée depuis ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Adresse de la maquette
        run: |
          echo "### Maquette déployée" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Si la page renvoie 404, activer une seule fois :" >> "$GITHUB_STEP_SUMMARY"
          echo "Settings → Pages → Source : *Deploy from a branch* → \`gh-pages\` / \`/ (root)\`." >> "$GITHUB_STEP_SUMMARY"
