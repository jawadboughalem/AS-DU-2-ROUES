name: Déploiement de la maquette

# Publie la maquette sur GitHub Pages à chaque push sur main.
# Le build tourne sur l'infrastructure GitHub : c'est le pipeline CI/CD
# normal d'un projet, et il ne dépend d'aucun compte tiers.
#
# Cette cible est provisoire : dès que le formulaire enverra réellement des
# e-mails et que l'espace d'administration existera, le site aura besoin de
# routes serveur et basculera sur Netlify (voir docs/DEPLOIEMENT.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configuration de Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: mise en ligne
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
